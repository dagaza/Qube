    <h1>Dust Bathing in Birds</h1>
    <p>Many bird species take dust baths to clean their feathers and remove parasites.</p>
    <h2>Why birds dust bathe</h2>
    <p>Dust absorbs excess oil and helps dislodge mites from plumage in dry habitats.</p>
    <h2>Common species</h2>
    <p>Sparrows, quail, and emus are well known for this behavior.</p>

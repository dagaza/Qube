[pytest]
# -p no:qt: this project has no Qt dependency; pytest-qt's exception-capture hook is
#   irrelevant here.
# --basetemp: some Windows setups deny writes to the shared system temp dir
#   (C:\...\AppData\Local\Temp\pytest-of-*); use a local, writable tmp dir instead.
addopts = -p no:qt --basetemp=.pytest_tmp
testpaths = tests

# Wake word config: "Hey Qube" (two-word phrase)
# Train with:  python scripts/train.py --config configs/hey_qube.yaml
#
# Two-word phrases consistently outperform single words (stronger acoustic
# signature => better recall + lower false-accept). Train this one FIRST.

wakeword:
  id: hey_keube
  display_name: "Hey Qube"
  phrase: "hey_keube"
  adversarial_phrases:
    - "hey cube"
    - "hey kube"
    - "hey tube"
    - "a cube"
    - "okay cube"

training:
  examples: 50000                 # production target; pilot at 5000 first
  steps: 50000                    # production target; pilot at 10000 first
  false_penalty: 2500
  layer_dim: 32
  augmentation_rounds: 2
  seed: 1337

data:
  sample_rate: 16000
  negative_features: datasets/features/librispeech_negatives.npy
  fp_validation_features: datasets/features/fp_validation.npy
  # Source audio (commercially licensed) for M2 feature precomputation.
  negative_source_paths:
    - datasets/speech            # LibriSpeech (CC-BY-4.0)
  validation_source_paths:
    - datasets/speech            # LibriSpeech dev (CC-BY-4.0)
    - datasets/background-noise  # MUSAN (CC-BY-4.0)
  background_paths:
    - datasets/background-noise
    - datasets/music
  rir_paths:
    - datasets/room-impulse

evaluation:
  # Ship rule used by evaluate.py: max recall subject to FP/hr <= cap.
  max_false_positives_per_hour: 1.0
  min_recall: 0.90               # two-word phrase target; loosen if noisy-room recall lags

export:
  formats: [onnx, tflite]
  install_hint: "~/.qube/models/wakeword/en/hey_keube/"

provenance:
  tier: commercial
  require_commercial_license: true
  oww_commit: "PINNED_COMMIT_TBD"

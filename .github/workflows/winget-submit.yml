name: WinGet Submit

# One-off or catch-up WinGet PRs without cutting a new app release.
# Requires an existing GitHub Release with all three Windows installers:
# Qube-<version>-Setup.exe, -vulkan-Setup.exe, and -cuda-Setup.exe.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to submit (e.g. 1.2.5 or v1.2.5)"
        required: true
        type: string

permissions:
  contents: read

env:
  WINGETCREATE_URL: https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe

jobs:
  winget:
    runs-on: windows-latest
    if: github.repository == 'dagaza/Qube'
    steps:
      - uses: actions/checkout@v4

      - name: Submit WinGet manifest PRs (CPU, Vulkan, CUDA)
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_SUBMIT_TOKEN }}
        run: |
          curl -sL "${{ env.WINGETCREATE_URL }}" -o wingetcreate.exe
          bash scripts/release/submit_winget_packages.sh \
            "${{ inputs.version }}" \
            "$WINGET_TOKEN" \
            ./wingetcreate.exe

name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate help corpus
        run: |
          python scripts/generate_help_reference.py --check
          python scripts/compose_help_corpus.py --check
          python scripts/validate_help_manifest.py
          python scripts/eval_help_golden.py
          python scripts/eval_help_production.py

      - name: Run tests
        run: pytest tests/ -v --tb=short -m "not packaging"

      - name: Security audit
        run: pip-audit -r requirements.txt --ignore-vuln CVE-2025-69872

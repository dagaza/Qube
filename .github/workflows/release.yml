name: Build & Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"
  PACKAGE_ID: dagaza.Qube
  WINGETCREATE_URL: https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short -m "not packaging"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, vulkan, cuda]
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer_hash: ${{ steps.hash.outputs.sha256 }}
      installer_name: ${{ steps.hash.outputs.filename }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync version into source
        run: python scripts/set_version.py ${{ steps.version.outputs.version }}

      - name: Install Vulkan SDK
        if: matrix.variant == 'vulkan'
        run: choco install vulkan-sdk -y --no-progress

      - name: Build PyInstaller bundle (${{ matrix.variant }})
        shell: pwsh
        env:
          LLAMA_BUILD_JOBS: ${{ matrix.variant == 'vulkan' && '2' || '1' }}
        run: |
          if ("${{ matrix.variant }}" -eq "vulkan") {
            if (-not $env:VULKAN_SDK) {
              $sdkRoot = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
                Sort-Object Name -Descending |
                Select-Object -First 1
              if ($sdkRoot) { $env:VULKAN_SDK = $sdkRoot.FullName }
            }
            if ($env:VULKAN_SDK) {
              $env:Path = "$env:VULKAN_SDK\Bin;$env:Path"
            }
          }
          & "$env:GITHUB_WORKSPACE\scripts\windows\build_windows_variant.ps1" "" "${{ matrix.variant }}"

      - name: Sign application binary
        if: vars.ENABLE_CODE_SIGNING == 'true'
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64 -or -not $env:WINDOWS_CERT_PASSWORD) {
            throw "ENABLE_CODE_SIGNING is true but signing secrets are missing"
          }
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $exe = (Resolve-Path "dist\Qube\Qube.exe").Path
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 $exe

      - name: Smoke test dist EXE
        shell: pwsh
        run: scripts/release/smoke_dist.ps1

      - name: Verify Vulkan bundle layout
        if: matrix.variant == 'vulkan'
        shell: pwsh
        run: scripts/release/verify_windows_vulkan_bundle.ps1

      - name: Verify CUDA bundle layout
        if: matrix.variant == 'cuda'
        shell: pwsh
        run: scripts/release/verify_windows_cuda_bundle.ps1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: iscc /DMyAppVersion=${{ steps.version.outputs.version }} /DMyAppVariant=${{ matrix.variant }} installer\qube.iss

      - name: CUDA silent install launch smoke (WinGet validation guard)
        if: matrix.variant == 'cuda'
        shell: pwsh
        run: |
          scripts/release/smoke_installed_cuda.ps1 `
            -SetupPath "installer/output/Qube-${{ steps.version.outputs.version }}-cuda-Setup.exe"

      - name: Sign installer
        if: vars.ENABLE_CODE_SIGNING == 'true'
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $setup = Get-ChildItem "installer\output\Qube-*-Setup.exe" |
            Where-Object {
              if ("${{ matrix.variant }}" -eq "cpu") {
                $_.Name -eq "Qube-${{ steps.version.outputs.version }}-Setup.exe"
              } else {
                $_.Name -eq "Qube-${{ steps.version.outputs.version }}-${{ matrix.variant }}-Setup.exe"
              }
            } |
            Select-Object -First 1
          if (-not $setup) { throw "Installer not found for variant ${{ matrix.variant }}" }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 $setup.FullName

      - name: Build prior-version installer for upgrade smoke test
        if: matrix.variant == 'cpu'
        id: old_installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $parts = $version -split '\.'
          if ($parts.Count -lt 3) { throw "Expected semver MAJOR.MINOR.PATCH, got $version" }
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]
          if ($patch -gt 0) {
            $oldVersion = "$major.$minor.$($patch - 1)"
          } elseif ($minor -gt 0) {
            $oldVersion = "$major.$($minor - 1).9"
          } elseif ($major -gt 0) {
            $oldVersion = "$($major - 1).9.9"
          } else {
            $oldVersion = "0.0.0"
          }
          echo "old_version=$oldVersion" >> $env:GITHUB_OUTPUT
          iscc /DMyAppVersion=$oldVersion installer\qube.iss

      - name: Smoke test installer upgrade
        if: matrix.variant == 'cpu'
        timeout-minutes: 20
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $oldVersion = "${{ steps.old_installer.outputs.old_version }}"
          $oldSetup = (Get-Item "installer\output\Qube-$oldVersion-Setup.exe").FullName
          $newSetup = (Get-Item "installer\output\Qube-$version-Setup.exe").FullName
          scripts/release/smoke_upgrade.ps1 `
            -OldSetup $oldSetup `
            -NewSetup $newSetup `
            -ExpectedOldVersion $oldVersion `
            -ExpectedNewVersion $version

      - name: Silent install, launch, and uninstall
        if: matrix.variant == 'cpu'
        timeout-minutes: 20
        shell: pwsh
        run: |
          scripts/release/smoke_installed.ps1 `
            -SetupPath "installer/output/Qube-${{ steps.version.outputs.version }}-Setup.exe"

      - name: Compute SHA256
        if: matrix.variant == 'cpu'
        id: hash
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $file = Get-Item "installer\output\Qube-$version-Setup.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "filename=$($file.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact (${{ matrix.variant }})
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.variant }}-${{ steps.version.outputs.version }}
          path: |
            installer/output/Qube-${{ steps.version.outputs.version }}-Setup.exe
            installer/output/Qube-${{ steps.version.outputs.version }}-vulkan-Setup.exe
            installer/output/Qube-${{ steps.version.outputs.version }}-cuda-Setup.exe

  chocolatey-packages:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*-${{ needs.build.outputs.version }}
          merge-multiple: true
          path: installers

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Render and pack Chocolatey packages
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $cpu = (Get-FileHash "installers/Qube-$version-Setup.exe" -Algorithm SHA256).Hash
          $vulkan = (Get-FileHash "installers/Qube-$version-vulkan-Setup.exe" -Algorithm SHA256).Hash
          $cuda = (Get-FileHash "installers/Qube-$version-cuda-Setup.exe" -Algorithm SHA256).Hash
          python scripts/render_chocolatey_package.py `
            --version $version `
            --cpu-sha256 $cpu `
            --vulkan-sha256 $vulkan `
            --cuda-sha256 $cuda
          foreach ($pkg in @("qube", "qube-vulkan", "qube-cuda")) {
            choco pack "chocolatey/out/$version/$pkg/$pkg.nuspec" `
              --output-directory "chocolatey/out/$version/$pkg"
          }

      - name: Validate Chocolatey packages
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          foreach ($pkg in @("qube", "qube-vulkan", "qube-cuda")) {
            choco info $pkg --source="chocolatey/out/$version/$pkg" --version="$version"
          }

      - name: Upload Chocolatey packages
        uses: actions/upload-artifact@v4
        with:
          name: chocolatey-package-${{ needs.build.outputs.version }}
          path: chocolatey/out/${{ needs.build.outputs.version }}/**/*.nupkg

  macos-build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync version into source
        run: python scripts/set_version.py ${{ steps.version.outputs.version }}

      - name: Install build dependencies
        run: bash scripts/macos/install_build_deps.sh

      - name: Generate .icns icon
        run: python scripts/generate_icns.py

      - name: Build .app bundle
        run: pyinstaller qube.spec --noconfirm

      - name: Build Uninstall Qube.app
        run: bash scripts/macos/build_uninstaller_app.sh ${{ steps.version.outputs.version }}

      - name: Import Developer ID certificate
        if: vars.ENABLE_MACOS_SIGNING == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash scripts/macos/import_codesign_cert.sh

      - name: Codesign app (hardened runtime)
        if: vars.ENABLE_MACOS_SIGNING == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          bash scripts/macos/codesign_app.sh "dist/Qube.app"
          bash scripts/macos/codesign_app.sh "dist/Uninstall Qube.app" packaging/macos/uninstaller-entitlements.plist

      - name: Build DMG
        run: |
          brew install create-dmg
          bash scripts/macos/make_dmg.sh \
            "dist/Qube.app" \
            "Qube-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg" \
            "dist/Uninstall Qube.app"

      - name: Notarize and staple DMG
        if: vars.ENABLE_MACOS_SIGNING == 'true'
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: bash scripts/macos/notarize.sh "Qube-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"

      - name: Smoke test DMG
        if: vars.ENABLE_MACOS_SIGNING == 'true'
        run: bash scripts/release/smoke_dmg.sh "Qube-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"

      - name: Smoke test uninstaller
        run: bash scripts/release/smoke_uninstall.sh "Qube-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"

      - name: Compute SHA256
        id: hash
        run: |
          f="Qube-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"
          echo "sha256=$(shasum -a 256 "$f" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}-${{ steps.version.outputs.version }}
          path: Qube-*-${{ matrix.arch }}.dmg

  linux-build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, vulkan, cuda]
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync version into source
        run: python scripts/set_version.py ${{ steps.version.outputs.version }}

      - name: Install Linux build dependencies
        run: bash scripts/linux/install_build_deps.sh ${{ matrix.variant }}

      - name: Fetch AppImage tools
        run: bash scripts/linux/fetch_appimage_tools.sh

      - name: Build PyInstaller bundle (${{ matrix.variant }})
        env:
          LLAMA_BUILD_JOBS: ${{ matrix.variant == 'vulkan' && '2' || '1' }}
        run: bash scripts/linux/build_linux.sh "" ${{ matrix.variant }}

      - name: Smoke test dist binary
        run: bash scripts/release/smoke_linux_dist.sh

      - name: Build AppImage (${{ matrix.variant }})
        run: bash scripts/linux/build_appimage.sh ${{ steps.version.outputs.version }} ${{ matrix.variant }}

      - name: Smoke test AppImage (${{ matrix.variant }})
        run: bash scripts/release/smoke_appimage.sh Qube-${{ steps.version.outputs.version }}-x86_64-${{ matrix.variant }}.AppImage

      - name: Build .deb (${{ matrix.variant }})
        run: bash scripts/linux/build_deb.sh ${{ steps.version.outputs.version }} ${{ matrix.variant }}

      - name: Build .rpm (${{ matrix.variant }})
        run: bash scripts/linux/build_rpm.sh ${{ steps.version.outputs.version }} ${{ matrix.variant }}

      - name: Build portable .tar.gz (${{ matrix.variant }})
        run: bash scripts/linux/build_tarball.sh ${{ steps.version.outputs.version }} ${{ matrix.variant }}

      - name: Upload Linux artifacts (${{ matrix.variant }})
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.variant }}-${{ steps.version.outputs.version }}
          path: |
            Qube-*-x86_64-${{ matrix.variant }}.AppImage
            Qube-*-x86_64-${{ matrix.variant }}.tar.gz
            qube*_${{ steps.version.outputs.version }}_amd64.deb
            qube_*_${{ steps.version.outputs.version }}_amd64.deb
            qube*.rpm
            qube-*.rpm

  release:
    needs: [build, macos-build, linux-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*-${{ needs.build.outputs.version }}
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-dmg-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Qube-*-Setup.exe
            Qube-*.dmg
            Qube-*-x86_64-cpu.AppImage
            Qube-*-x86_64-vulkan.AppImage
            Qube-*-x86_64-cuda.AppImage
            Qube-*-x86_64-cpu.tar.gz
            Qube-*-x86_64-vulkan.tar.gz
            Qube-*-x86_64-cuda.tar.gz
            qube_*_amd64.deb
            qube-vulkan_*_amd64.deb
            qube-cuda_*_amd64.deb
            qube-*.x86_64.rpm
          body: |
            ## Install

            **Windows** (pick the build that matches your GPU)

            ```powershell
            # CPU (works everywhere):
            winget install -e --id dagaza.Qube
            choco install qube

            # GPU builds (install one variant only):
            winget install -e --id dagaza.Qube.Vulkan   # AMD / Intel
            choco install qube-vulkan                   # AMD / Intel
            winget install -e --id dagaza.Qube.CUDA     # NVIDIA
            choco install qube-cuda                     # NVIDIA

            # Or direct download from assets below:
            # Qube-${{ needs.build.outputs.version }}-Setup.exe          — CPU
            # Qube-${{ needs.build.outputs.version }}-vulkan-Setup.exe   — AMD / Intel (Vulkan)
            # Qube-${{ needs.build.outputs.version }}-cuda-Setup.exe     — NVIDIA (CUDA)
            ```

            **macOS**

            ```bash
            # Custom tap (unsigned DMG — see Gatekeeper caveats during install):
            brew tap dagaza/qube
            brew install --cask qube

            # Or download DMG: arm64 / x86_64 assets below
            ```

            **Linux** (x86_64 — pick the build that matches your GPU)

            ```bash
            # CPU-only (works everywhere, slower inference):
            chmod +x Qube-${{ needs.build.outputs.version }}-x86_64-cpu.AppImage
            ./Qube-${{ needs.build.outputs.version }}-x86_64-cpu.AppImage

            # AMD / Intel GPU (Vulkan):
            chmod +x Qube-${{ needs.build.outputs.version }}-x86_64-vulkan.AppImage
            ./Qube-${{ needs.build.outputs.version }}-x86_64-vulkan.AppImage

            # NVIDIA GPU (CUDA; requires recent proprietary driver):
            chmod +x Qube-${{ needs.build.outputs.version }}-x86_64-cuda.AppImage
            ./Qube-${{ needs.build.outputs.version }}-x86_64-cuda.AppImage

            # Debian/Ubuntu (.deb — install one variant only):
            sudo apt install ./qube_${{ needs.build.outputs.version }}_amd64.deb
            sudo apt install ./qube-vulkan_${{ needs.build.outputs.version }}_amd64.deb
            sudo apt install ./qube-cuda_${{ needs.build.outputs.version }}_amd64.deb

            # Fedora/RHEL (.rpm — install one variant only):
            sudo dnf install ./qube-${{ needs.build.outputs.version }}-1.x86_64.rpm
            sudo dnf install ./qube-vulkan-${{ needs.build.outputs.version }}-1.x86_64.rpm
            sudo dnf install ./qube-cuda-${{ needs.build.outputs.version }}-1.x86_64.rpm

            # Portable tarball (extract and run ./Qube/Qube):
            tar -xzf Qube-${{ needs.build.outputs.version }}-x86_64-vulkan.tar.gz
            ./Qube/Qube

            qube   # when installed via .deb or .rpm
            ```

            **SHA256 (Windows CPU installer):** `${{ needs.build.outputs.installer_hash }}`

            **Silent install (Windows):** `${{ needs.build.outputs.installer_name }} /VERYSILENT /SUPPRESSMSGBOXES /NORESTART`

            **Update an existing install:** run the new **`Qube-${{ needs.build.outputs.version }}-Setup.exe`** (Windows), replace **`Qube.app`** from the DMG (macOS), or **`sudo apt install ./qube_….deb`** / re-run **`install_appimage.sh`** (Linux). User data is kept — see [Update Qube](https://github.com/dagaza/Qube/blob/main/docs/user/update-qube.md).

  winget-manifests:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*-${{ needs.build.outputs.version }}
          merge-multiple: true
          path: installers

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compute SHA256 and render WinGet manifests
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $cpu = (Get-FileHash "installers/Qube-$version-Setup.exe" -Algorithm SHA256).Hash
          $vulkan = (Get-FileHash "installers/Qube-$version-vulkan-Setup.exe" -Algorithm SHA256).Hash
          $cuda = (Get-FileHash "installers/Qube-$version-cuda-Setup.exe" -Algorithm SHA256).Hash
          python scripts/render_winget_manifests.py `
            --version $version `
            --cpu-sha256 $cpu `
            --vulkan-sha256 $vulkan `
            --cuda-sha256 $cuda

      - name: Validate WinGet manifests
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          foreach ($pkg in @("dagaza.Qube", "dagaza.Qube.Vulkan", "dagaza.Qube.CUDA")) {
            winget validate --manifest "winget/out/$version/$pkg"
          }

      - name: Upload WinGet manifests
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests-${{ needs.build.outputs.version }}
          path: winget/out/${{ needs.build.outputs.version }}/

  winget:
    needs: [build, release, winget-manifests]
    runs-on: windows-latest
    if: github.repository == 'dagaza/Qube' && vars.WINGET_AUTO_SUBMIT == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: winget-manifests-${{ needs.build.outputs.version }}
          path: winget/out/${{ needs.build.outputs.version }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Submit WinGet manifest PRs (CPU, Vulkan, CUDA)
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_SUBMIT_TOKEN }}
        run: |
          curl -sL "${{ env.WINGETCREATE_URL }}" -o wingetcreate.exe
          bash scripts/release/submit_winget_packages.sh \
            "${{ needs.build.outputs.version }}" \
            "$WINGET_TOKEN" \
            ./wingetcreate.exe \
            "winget/out/${{ needs.build.outputs.version }}"

  homebrew:
    needs: [macos-build, release]
    runs-on: macos-14
    if: github.repository == 'dagaza/Qube' && vars.HOMEBREW_AUTO_SUBMIT == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-dmg-*
          merge-multiple: true

      - name: Render cask
        run: |
          VERSION="${{ needs.macos-build.outputs.version }}"
          python scripts/render_homebrew_cask.py \
            --version "$VERSION" \
            --sha256-arm64  "$(shasum -a 256 "Qube-$VERSION-arm64.dmg"  | awk '{print $1}')" \
            --sha256-x86_64 "$(shasum -a 256 "Qube-$VERSION-x86_64.dmg" | awk '{print $1}')"

      - name: Validate cask (style only; unsigned custom tap)
        run: |
          VERSION="${{ needs.macos-build.outputs.version }}"
          TAP_DIR="$(brew --repository)/Library/Taps/dagaza/homebrew-qube"
          mkdir -p "$TAP_DIR/Casks"
          cp "homebrew/out/$VERSION/qube.rb" "$TAP_DIR/Casks/qube.rb"
          brew style "$TAP_DIR/Casks/qube.rb"

      - name: Commit bump to tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash scripts/macos/bump_tap.sh "${{ needs.macos-build.outputs.version }}"

  chocolatey-test:
    needs: [build, release, chocolatey-packages]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: chocolatey-package-${{ needs.build.outputs.version }}
          path: pkg/

      - name: Install, launch, and uninstall via Chocolatey
        shell: pwsh
        run: scripts/release/smoke_choco.ps1 -Version ${{ needs.build.outputs.version }} -PackageDir pkg

  chocolatey-push:
    needs: [build, release, chocolatey-test, chocolatey-packages]
    runs-on: windows-latest
    if: github.repository == 'dagaza/Qube' && vars.CHOCOLATEY_AUTO_PUSH == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: chocolatey-package-${{ needs.build.outputs.version }}
          path: pkg/

      - name: Push to Chocolatey Community Repository
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          scripts/release/push_chocolatey_packages.ps1 `
            -Version ${{ needs.build.outputs.version }} `
            -PackageRoot pkg

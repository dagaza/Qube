name: Build & Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"
  PACKAGE_ID: dagaza.Qube

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short -m "not packaging"

  build:
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer_hash: ${{ steps.hash.outputs.sha256 }}
      installer_name: ${{ steps.hash.outputs.filename }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync version into source
        run: python scripts/set_version.py ${{ steps.version.outputs.version }}

      - name: Install build dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate application icon
        run: python scripts/generate_ico.py

      - name: Build executable
        run: pyinstaller qube.spec --noconfirm

      - name: Sign application binary
        if: vars.ENABLE_CODE_SIGNING == 'true'
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64 -or -not $env:WINDOWS_CERT_PASSWORD) {
            throw "ENABLE_CODE_SIGNING is true but signing secrets are missing"
          }
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $exe = (Resolve-Path "dist\Qube\Qube.exe").Path
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 $exe

      - name: Smoke test dist EXE
        shell: pwsh
        run: scripts/release/smoke_dist.ps1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: iscc /DMyAppVersion=${{ steps.version.outputs.version }} installer\qube.iss

      - name: Sign installer
        if: vars.ENABLE_CODE_SIGNING == 'true'
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $setup = (Get-Item "installer\output\Qube-*-Setup.exe").FullName
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 $setup

      - name: Silent install, launch, and uninstall
        shell: pwsh
        run: scripts/release/smoke_installed.ps1

      - name: Compute SHA256
        id: hash
        shell: pwsh
        run: |
          $file = Get-Item "installer\output\Qube-*-Setup.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "filename=$($file.Name)" >> $env:GITHUB_OUTPUT

      - name: Generate WinGet manifests
        run: python scripts/render_winget_manifests.py --version ${{ steps.version.outputs.version }} --sha256 ${{ steps.hash.outputs.sha256 }}

      - name: Validate WinGet manifests
        shell: pwsh
        run: winget validate --manifest "winget/out/${{ steps.version.outputs.version }}"

      - name: Render Chocolatey package
        run: python scripts/render_chocolatey_package.py --version ${{ steps.version.outputs.version }} --sha256 ${{ steps.hash.outputs.sha256 }}

      - name: Pack Chocolatey package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          choco pack "chocolatey/out/$version/qube.nuspec" --output-directory "chocolatey/out/$version"

      - name: Validate Chocolatey package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          choco info qube --source="chocolatey/out/$version" --version="$version"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ steps.version.outputs.version }}
          path: installer/output/Qube-*-Setup.exe

      - name: Upload WinGet manifests
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests-${{ steps.version.outputs.version }}
          path: winget/out/${{ steps.version.outputs.version }}/

      - name: Upload Chocolatey package
        uses: actions/upload-artifact@v4
        with:
          name: chocolatey-package-${{ steps.version.outputs.version }}
          path: chocolatey/out/${{ steps.version.outputs.version }}/qube.${{ steps.version.outputs.version }}.nupkg

  macos-build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync version into source
        run: python scripts/set_version.py ${{ steps.version.outputs.version }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
          # Rebuild llama-cpp-python with Metal acceleration for Apple GPUs.
          CMAKE_ARGS="-DGGML_METAL=on" pip install --force-reinstall --no-binary=llama-cpp-python llama-cpp-python

      - name: Generate .icns icon
        run: python scripts/generate_icns.py

      - name: Build .app bundle
        run: pyinstaller qube.spec --noconfirm

      - name: Import Developer ID certificate
        if: vars.ENABLE_MACOS_SIGNING == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash scripts/macos/import_codesign_cert.sh

      - name: Codesign app (hardened runtime)
        if: vars.ENABLE_MACOS_SIGNING == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: bash scripts/macos/codesign_app.sh "dist/Qube.app"

      - name: Build DMG
        run: |
          brew install create-dmg
          bash scripts/macos/make_dmg.sh \
            "dist/Qube.app" \
            "Qube-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"

      - name: Notarize and staple DMG
        if: vars.ENABLE_MACOS_SIGNING == 'true'
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: bash scripts/macos/notarize.sh "Qube-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"

      - name: Smoke test DMG
        if: vars.ENABLE_MACOS_SIGNING == 'true'
        run: bash scripts/release/smoke_dmg.sh "Qube-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"

      - name: Compute SHA256
        id: hash
        run: |
          f="Qube-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"
          echo "sha256=$(shasum -a 256 "$f" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}-${{ steps.version.outputs.version }}
          path: Qube-*-${{ matrix.arch }}.dmg

  release:
    needs: [build, macos-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer-${{ needs.build.outputs.version }}

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-dmg-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Qube-*-Setup.exe
            Qube-*.dmg
          body: |
            ## Install

            **Windows**

            ```powershell
            winget install -e --id ${{ env.PACKAGE_ID }}
            choco install qube
            ```

            **macOS** (download the DMG for your architecture below)

            ```bash
            # Apple Silicon: Qube-${{ needs.build.outputs.version }}-arm64.dmg
            # Intel:         Qube-${{ needs.build.outputs.version }}-x86_64.dmg
            ```

            **SHA256 (Windows installer):** `${{ needs.build.outputs.installer_hash }}`

            **Silent install (Windows):** `${{ needs.build.outputs.installer_name }} /VERYSILENT /SUPPRESSMSGBOXES /NORESTART`

  winget:
    needs: [build, release]
    runs-on: ubuntu-latest
    if: github.repository == 'dagaza/Qube' && vars.WINGET_AUTO_SUBMIT == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: winget-manifests-${{ needs.build.outputs.version }}
          path: winget/out/${{ needs.build.outputs.version }}

      - name: Submit WinGet manifest PR
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_SUBMIT_TOKEN }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          URL="https://github.com/dagaza/Qube/releases/download/v${VERSION}/Qube-${VERSION}-Setup.exe"
          curl -sL https://aka.ms/wingetcreate/latest -o wingetcreate
          chmod +x wingetcreate
          ./wingetcreate update ${{ env.PACKAGE_ID }} \
            --version "$VERSION" \
            --urls "$URL" \
            --token "$WINGET_TOKEN" \
            --submit

  homebrew:
    needs: [macos-build, release]
    runs-on: macos-14
    if: github.repository == 'dagaza/Qube' && vars.HOMEBREW_AUTO_SUBMIT == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-dmg-*
          merge-multiple: true

      - name: Render cask
        run: |
          VERSION="${{ needs.macos-build.outputs.version }}"
          python scripts/render_homebrew_cask.py \
            --version "$VERSION" \
            --sha256-arm64  "$(shasum -a 256 "Qube-$VERSION-arm64.dmg"  | awk '{print $1}')" \
            --sha256-x86_64 "$(shasum -a 256 "Qube-$VERSION-x86_64.dmg" | awk '{print $1}')"

      - name: Audit cask
        run: |
          VERSION="${{ needs.macos-build.outputs.version }}"
          TAP_DIR="$(brew --repository)/Library/Taps/dagaza/homebrew-qube"
          mkdir -p "$TAP_DIR/Casks"
          cp "homebrew/out/$VERSION/qube.rb" "$TAP_DIR/Casks/qube.rb"
          brew style "$TAP_DIR/Casks/qube.rb"
          brew audit --cask --online "dagaza/qube/qube"

      - name: Commit bump to tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash scripts/macos/bump_tap.sh "${{ needs.macos-build.outputs.version }}"

  chocolatey-test:
    needs: [build, release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: chocolatey-package-${{ needs.build.outputs.version }}
          path: pkg/

      - name: Install, launch, and uninstall via Chocolatey
        shell: pwsh
        run: scripts/release/smoke_choco.ps1 -Version ${{ needs.build.outputs.version }} -PackageDir pkg

  chocolatey-push:
    needs: [build, release, chocolatey-test]
    runs-on: windows-latest
    if: github.repository == 'dagaza/Qube' && vars.CHOCOLATEY_AUTO_PUSH == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chocolatey-package-${{ needs.build.outputs.version }}
          path: pkg/

      - name: Push to Chocolatey Community Repository
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $nupkg = Get-ChildItem pkg\*.nupkg | Select-Object -First 1
          choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY

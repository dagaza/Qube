name: Stale

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            This issue has been inactive for 60 days and will be closed in 7 days
            if there is no further activity. Comment or reopen if it is still relevant.
          close-issue-message: Closed due to inactivity. Reopen or open a new issue if needed.
          stale-pr-message: >
            This pull request has been inactive for 21 days and will be closed in 7 days
            if there is no further activity. Push an update or comment to keep it open.
          close-pr-message: Closed due to inactivity. Reopen or submit a fresh PR if needed.
          days-before-issue-stale: 60
          days-before-issue-close: 7
          days-before-pr-stale: 21
          days-before-pr-close: 7
          exempt-issue-labels: pinned,security,RFC required
          exempt-pr-labels: pinned,security,RFC required,trusted-contributor
          operations-per-run: 100
